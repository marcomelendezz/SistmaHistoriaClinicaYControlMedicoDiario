{% extends "base/header_navbar.html" %}
{% load static %}
{% block title %}Mi Perfil{% endblock %}
{% block content %} 
<div class="container py-4">
	<h1 class="h3 mb-4">Mi Perfil</h1>
	<a href="{% url 'editar_perfil' %}" class="btn btn-primary mb-3">Editar perfil</a>
	<section class="border rounded p-4 bg-white" aria-label="Información del perfil">
		<dl class="row mb-0">
			<dt class="col-sm-3">Nombre</dt>
			<dd class="col-sm-9">{{ perfil.nombre }}</dd>

			<dt class="col-sm-3">Apellido</dt>
			<dd class="col-sm-9">{{ perfil.apellido }}</dd>

			<dt class="col-sm-3">Correo electrónico</dt>
			<dd class="col-sm-9">{{ perfil.email }}</dd>

			<dt class="col-sm-3">Cargo</dt>
			<dd class="col-sm-9">{{ perfil.cargo }}</dd>
		</dl>
	</section>
</div>
{% endblock %}
