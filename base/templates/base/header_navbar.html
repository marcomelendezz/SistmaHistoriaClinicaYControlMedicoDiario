{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'base/css/stylelogin.css' %}">
    <link rel="stylesheet" href="{% static 'base/css/styleheadernav.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>{% block title %}Sin título{% endblock %}</title>
</head>
<body>
    <header>
        <img src="{% static 'base/img/logo_univ_uptag.png' %}" alt="Logo de la uni" class="logo_uni">
    </header>

    <div class="container-fluid p-0">
        <div class="row g-0">
            <aside class="col-md-3 col-lg-2 min-vh-100 p-3 mi-color">
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white">Inicio</a>
                    </li>
                    <li>
                        <a href="#" class="nav-link text-white">Registro Estudiante</a>
                    </li>
                </ul>
            </aside>

            <main class="col-md-9 col-lg-10 contenido-principal">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
