{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'base/css/stylelogin.css' %}">
    <link rel="stylesheet" href="{% static 'base/css/styleheadernav.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>{% block title %}Sin título{% endblock %}</title>
</head>
<body>
    <header>
        <img src="{% static 'base/img/logo_univ_uptag.png' %}" alt="Logo de la uni" class="logo_uni">
    </header>

    <div class="container-fluid p-0">
        <div class="row g-0">
            <aside class="col-md-3 col-lg-2 min-vh-100 p-3 mi-color">
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="{% url 'dashboard' %}" class="nav-link text-white">Inicio</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white w-100" href="#" id="HistoriaDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Historias Clinicas
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark w-100" aria-labelledby="HistoriaDropdown">
                            <li><a class="dropdown-item" href="{% url 'registro_historia' %}">Registrar</a></li>
                            <li><a class="dropdown-item" href="{% url 'nueva_consulta' %}">Nueva Consulta</a></li>
                            <li><a class="dropdown-item" href="{% url 'lista_historia' %}">lista de historias clínicas</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'mi_perfil' %}" class="nav-link text-white">Mi Perfil</a>
                    </li>
                     <li class="nav-item">
                        <a href="{% url 'login' %}" class="nav-link text-white">Cerrar Sesion</a>
                    </li>
                </ul>
            </aside>

            <main class="col-md-9 col-lg-10 contenido-principal">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</html>
